[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "myqubits"
version = "0.0.4"
description = "Quantum information and open quantum systems: states, partial traces, entropies, entanglement, channels, Lindblad equations (Python port of the MyQubits Mathematica package)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Salvatore Lorenzo" }]
dependencies = ["numpy>=1.25", "scipy>=1.12"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
symbolic = ["sympy>=1.12"]
test = ["pytest>=7"]
all = ["matplotlib>=3.7", "sympy>=1.12", "pytest>=7"]

[tool.setuptools]
packages = ["myqubits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
